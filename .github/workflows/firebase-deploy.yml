name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (Root & Workspaces)
        run: npm ci

      - name: Build Functions
        run: npm run build:functions

      - name: Build Web
        run: npm run build:web

      - name: Fix Firebase Workspace Check
        working-directory: ./functions
        run: |
          # Firebase CLI explicitly checks functions/node_modules/firebase-functions
          # In an npm workspace, it is hoisted to root, so we symlink it to pass the check.
          ln -sf ../node_modules ./node_modules

      - name: Create .env file for production
        working-directory: ./functions
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env

      - name: Deploy to Firebase
        run: npx -y firebase-tools deploy --non-interactive --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
